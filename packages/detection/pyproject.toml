[project]
name = "objhist-detection"
version = "0.1.0"
description = "YOLO26 kitchen object detector: dataset preparation, training, and inference."
requires-python = ">=3.12,<3.14"
dependencies = [
    "clip",
    "mlflow>=3,<4",
    "objhist-core",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "ultralytics>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objhist_detection"]

[tool.uv.sources]
objhist-core = { workspace = true }
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }
