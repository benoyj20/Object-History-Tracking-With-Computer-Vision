[project]
name = "objhist-tracking"
version = "0.1.0"
description = "Object identity association across frames and the object history log."
requires-python = ">=3.12,<3.14"
dependencies = [
    "huggingface-hub>=1,<3",
    "objhist-core",
    "pillow>=11,<13",
    "scipy>=1.14,<2",
    "transformers>=5.23,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objhist_tracking"]

[tool.uv.sources]
objhist-core = { workspace = true }
